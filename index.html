<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productivity-Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Productivity-Dashboard</h1>
    <main>
      <div id="dashboard-home">
        <button data-feature="todo">Todo</button>
        <button data-feature="planner">Planner</button>
        <button data-feature="motivation">Motivation</button>
        <button data-feature="pomodoro">Pomodoro</button>
        <button data-feature="goals">Goals</button>
      </div>

      <section id="todo-section" class="feature-view" hidden>
        <h2>Todo</h2>
        <button class="back-button">Back</button>
      </section>
      <section id="planner-section" class="feature-view" hidden>
        <h2>Planner</h2>
        <button class="back-button">Back</button>
      </section>
      <section id="motivation-section" class="feature-view" hidden>
        <h2>Motivation</h2>
        <button class="back-button">Back</button>
      </section>
      <section id="pomodoro-section" class="feature-view" hidden>
        <h2>Pomodoro</h2>
        <button class="back-button">Back</button>
      </section>
      <section id="goals-section" class="feature-view" hidden>
        <h2>Goals</h2>
        <button class="back-button">Back</button>
      </section>

      <section id="date-time">Date/time</section>
      <section id="weather">Weather</section>
    </main>

    <script src="./script.js" defer></script>
  </body>
</html>
